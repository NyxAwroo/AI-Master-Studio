[package]
name = "ai-master-studio-v35"
version = "3.5.0"
description = "AI Master Studio - Gestionnaire de prompts et bibliothèque d'images IA"
authors = ["Nicol"]
edition = "2021"

[lib]
name = "ai_master_studio_v35_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
